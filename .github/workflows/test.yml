name: Test
on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The locked dev dependencies (PHPUnit 9.3, Prophecy 1.11) don't install on PHP 8.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit -c tests/phpunit.xml --no-coverage
